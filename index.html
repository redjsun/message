<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>convite especial</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="wrapper" id="etapa1">
        <h2 class="question">você está convidado pra um grandioso evento, topa? </h2>
        <img class="gif" alt="gif" src="https://media.giphy.com/media/FTGah7Mx3ss04PcasF/giphy.gif"/>
        <h2 class="event-info">
            24/05/25 - 16h00<br>
            Cerrado Paintball (Gama-DF) 
            <a href="https://maps.app.goo.gl/cfU4GfkJJAwhGYWX6" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" 
                     alt="Localização" 
                     style="width: 20px; height: 20px; vertical-align: middle;">
            </a>
        </h2>
        <div class="btn-group">
            <button class="yes-btn" id="sim1">Sim</button>
            <button class="no-btn" id="noBtn">Não</button>
        </div>
    </div>
    <div class="wrapper hidden" id="etapa2">
        <h2>você quer ir mesmo?</h2>
        <img class="gif" alt="gif" src="https://media.giphy.com/media/FTGah7Mx3ss04PcasF/giphy.gif"/>
        <div class="btn-group">
            <button class="yes-btn" id="sim2">SIM MESMO!</button>
            <button class="no-btn" id="nao2">Agora não</button>
        </div>
    </div>
    <div class="form-container hidden" id="etapa3">
        <h2>Por favor, insira seu nome:</h2>
        <form id="formConfirmacao">
            <input type="text" id="nome" placeholder="Seu nome" required />
            <button type="submit" class="yes-btn">Confirmar</button>
        </form>
        <a href="https://chat.whatsapp.com/I4yuoqNgGmN49jhnw77Dow" target="_blank" style="display: flex; justify-content: center; margin-top: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" style="width: 50px; height: 50px;">
        </a>
    </div>
    <script src="script.js"></script>
</body>
</html>
